<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="theme-color" content="#0F172A">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://versabold.com/blog/">

  <title>Blog — VersaBold Innovations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

<body>
  <div id="header-root"></div>

  <main class="blog-main">
    <section class="blog-hero">
      <div class="container">
        <p class="eyebrow">Publicaciones</p>

      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/icons.js"></script>
  <script src="../data/site-data.js" defer></script>
  <script src="../components/header.js" defer></script>
  <script src="../components/footer.js" defer></script>
  <script src="../scripts/animations.js" defer></script>
  <script src="../scripts/blog.js" defer></script>
